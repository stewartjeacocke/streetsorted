# Build and deploy the independently deployable static-site package to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ['deploy']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static-site artifact
        run: npm run build:static-site
        env:
          # Configure this repository Actions variable with the public Node.js server origin.
          PUBLIC_SERVER_BASE_URL: ${{ vars.PUBLIC_SERVER_BASE_URL }}
          SOURCE_REVISION: ${{ github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static-site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/static-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
